<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buddyfit Hero Chat UI</title>
  <style>
    :root {
      --accent: #f46375;
      --accent-hover: #d8465a;
      --user-bubble: #cfe9f7;
      --manager-bubble: #f5ecdd;
      --text: #2b2b2b;
      --muted: #a0927e;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #faf8f5;
      color: var(--text);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    button { font: inherit; }

    .chat-widget {
      width: min(340px, 100%);
      height: min(610px, calc(100vh - 32px));
      min-height: 480px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 4px solid #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(43, 43, 43, 0.18);
    }

    .chat-header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--accent);
    }

    .icon-button {
      flex: none;
      border: 0;
      padding: 4px 6px;
      color: #fff;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .reset-button { color: rgba(255, 255, 255, 0.85); font-size: 18px; }

    .avatar-wrap { position: relative; flex: none; width: 38px; height: 38px; }

    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.22);
    }

    .avatar-small { width: 30px; height: 30px; flex: none; }

    .online-dot {
      position: absolute;
      right: 1px;
      bottom: 1px;
      width: 10px;
      height: 10px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      background: #4ade80;
    }

    .header-info { flex: 1; min-width: 0; }
    .header-name { color: #fff; font-size: 14px; font-weight: 700; line-height: 1.2; }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { border-radius: 3px; background: rgba(0, 0, 0, 0.35); }

    .qa-note {
      align-self: center;
      margin: 4px 0 8px;
      padding: 3px 10px;
      border-radius: 10px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.06);
      font-size: 11px;
      text-align: center;
    }

    .message { display: flex; flex-direction: column; gap: 2px; animation: appear 0.25s ease both; }
    .message-user { align-items: flex-end; }
    .message-manager { flex-direction: row; align-items: flex-start; gap: 6px; }
    .message-column { display: flex; flex-direction: column; gap: 2px; }
    .manager-name { margin: 0 0 2px 2px; color: #7a6a5a; font-size: 11px; }

    .bubble {
      max-width: 78%;
      padding: 9px 13px;
      font-size: 13px;
      line-height: 1.55;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .bubble-user { border-radius: 16px; color: #2b3b45; background: var(--user-bubble); }
    .bubble-manager { border-radius: 16px 16px 16px 4px; color: #4a3f30; background: var(--manager-bubble); }
    .timestamp { margin: 0 2px; color: var(--muted); font-size: 10px; }

    .typing-row { display: flex; align-items: flex-end; gap: 6px; animation: appear 0.2s ease both; }
    .typing-dots { display: flex; gap: 4px; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--manager-bubble); }
    .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: #bbb; animation: typing 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 4px;
      animation: appear 0.25s ease both;
    }

    .chip {
      border: 1.5px solid var(--accent);
      border-radius: 20px;
      padding: 7px 13px;
      color: var(--accent);
      background: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .chip:hover { color: #fff; background: var(--accent); }
    .chip:focus-visible, .icon-button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .input-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      background: #f0ebe3;
    }

    .input-placeholder {
      flex: 1;
      padding: 8px 14px;
      border-radius: 20px;
      color: #bbb;
      background: #fff;
      font-size: 13px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .send-button {
      flex: none;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
    }

    .hidden { display: none !important; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    @keyframes appear {
      from { transform: translateY(5px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 420px) {
      body { padding: 0; }
      .chat-widget { width: 100%; height: 100%; min-height: 100%; border: 0; border-radius: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="chat-widget" aria-label="버디핏 상담 미리보기">
    <header class="chat-header">
      <button class="icon-button" type="button" aria-label="뒤로 가기">←</button>
      <div class="avatar-wrap">
        <!-- 원하는 이미지 경로를 src에 입력하세요. -->
        <img class="avatar manager-image" src="" alt="매니저 프로필">
        <span class="online-dot" aria-hidden="true"></span>
      </div>
      <div class="header-info">
        <div class="header-name manager-name-text">O O 매니저</div>
      </div>
      <button class="icon-button reset-button" id="resetChat" type="button" aria-label="대화 다시 보기">↺</button>
    </header>

    <section class="chat-messages" id="chatMessages" aria-live="polite">
      <div class="qa-note">선택한 매니저가 직접 작성한 질답 입니다.</div>

      <div class="message message-user hidden" id="firstMessage">
        <div class="bubble bubble-user">소개팅 잘하고 싶은데 뭐부터 해야 할지 모르겠어요</div>
        <div class="timestamp current-time"></div>
      </div>

      <div class="typing-row hidden" id="typingIndicator">
        <img class="avatar avatar-small manager-image" src="" alt="">
        <div class="typing-dots" aria-label="매니저가 입력 중">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="message message-manager hidden" id="managerMessage">
        <img class="avatar avatar-small manager-image" src="" alt="">
        <div class="message-column">
          <div class="manager-name manager-name-text">O O 매니저</div>
          <div class="bubble bubble-manager">그 마음이 제일 중요해요. 우선 첫인상부터 같이 점검해볼까요?</div>
          <div class="timestamp current-time"></div>
        </div>
      </div>

      <div class="chips hidden" id="chatChips" aria-label="답변 선택">
        <button class="chip" type="button" data-reply="과하지 않게, 깔끔한 인상을 주는 코디부터 같이 봐드릴게요.">코디가 걱정돼요</button>
        <button class="chip" type="button" data-reply="자연스러운 대화 흐름은 연습으로 충분히 늘어요. 예시부터 드려볼게요.">대화가 어려워요</button>
        <button class="chip" type="button" data-reply="본인은 못 보는 매력, 여성의 시선으로 솔직하게 짚어드릴게요.">제 매력을 모르겠어요</button>
      </div>
    </section>

    <footer class="input-bar">
      <div class="input-placeholder">실제 상담에서는 자유롭게 대화할 수 있어요</div>
      <button class="send-button" type="button" aria-label="메시지 보내기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </footer>
  </main>

  <script>
    const chat = {
      managerName: "O O 매니저",
      managerImage: "" // 여기에 이미지 경로 또는 URL을 입력하세요.
    };

    const messages = document.getElementById("chatMessages");
    const firstMessage = document.getElementById("firstMessage");
    const typingIndicator = document.getElementById("typingIndicator");
    const managerMessage = document.getElementById("managerMessage");
    const chatChips = document.getElementById("chatChips");
    const timers = [];

    function setContent() {
      document.querySelectorAll(".manager-name-text").forEach((element) => {
        element.textContent = chat.managerName;
      });
      document.querySelectorAll(".manager-image").forEach((image) => {
        image.src = chat.managerImage;
      });
    }

    function currentTime() {
      return new Intl.DateTimeFormat("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(new Date());
    }

    function updateTimes(includeReadMark = true) {
      document.querySelectorAll(".current-time").forEach((element, index) => {
        element.textContent = currentTime() + (includeReadMark && index === 0 ? " ✓✓" : "");
      });
    }

    function show(element) {
      element.classList.remove("hidden");
      requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
    }

    function clearTimers() {
      while (timers.length) clearTimeout(timers.pop());
    }

    function removeReplies() {
      messages.querySelectorAll(".generated-reply").forEach((element) => element.remove());
    }

    function restartChat() {
      clearTimers();
      removeReplies();
      [firstMessage, typingIndicator, managerMessage, chatChips].forEach((element) => element.classList.add("hidden"));
      updateTimes();
      timers.push(setTimeout(() => show(firstMessage), 600));
      timers.push(setTimeout(() => show(typingIndicator), 1400));
      timers.push(setTimeout(() => {
        typingIndicator.classList.add("hidden");
        show(managerMessage);
      }, 2600));
      timers.push(setTimeout(() => show(chatChips), 3200));
    }

    function selectChip(button) {
      chatChips.classList.add("hidden");
      const time = currentTime();
      const fragment = document.createRange().createContextualFragment(`
        <div class="message message-user generated-reply">
          <div class="bubble bubble-user"></div>
          <div class="timestamp">${time} ✓✓</div>
        </div>
        <div class="message message-manager generated-reply">
          <img class="avatar avatar-small" src="${chat.managerImage}" alt="">
          <div class="message-column">
            <div class="manager-name">${chat.managerName}</div>
            <div class="bubble bubble-manager"></div>
            <div class="timestamp">${time}</div>
          </div>
        </div>
      `);
      const replyNodes = fragment.querySelectorAll(".bubble");
      replyNodes[0].textContent = button.textContent;
      replyNodes[1].textContent = button.dataset.reply;
      messages.append(fragment);
      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("resetChat").addEventListener("click", restartChat);
    chatChips.addEventListener("click", (event) => {
      const button = event.target.closest(".chip");
      if (button) selectChip(button);
    });

    setContent();
    restartChat();
  </script>
</body>
</html>
